name: test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      should_run_unit_tests: ${{ steps.check-unit-tests.outputs.src }}
      should_run_integration_tests: ${{ steps.check-integration-tests.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check-unit-tests
        name: Should run unit tests
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - "async_batcher/**"
              - "tests/**"
              - "poetry.lock"
              - ".github/workflows/ci.yml"

      - id: check-integration-tests
        name: Should run integration tests
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - "async_batcher/aws/**"
              - "async_batcher/scylladb/**"
              - "async_batcher/sqlalchemy/**"
              - "tests/integration/**"
              - "poetry.lock"

  core-tests:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.should_run_unit_tests == 'true' || github.event.action == 'reopened' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core and test dependencies without adapter extras
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          poetry = tomllib.loads(Path("pyproject.toml").read_text())["tool"]["poetry"]
          dependencies = poetry.get("group", {}).get("dev", {}).get(
              "dependencies", poetry.get("dev-dependencies", {})
          )
          requirements = []
          for name in ("pytest", "pytest-asyncio", "pygments"):
              if name == "pygments" and name not in dependencies:
                  continue
              constraint = dependencies[name]
              if constraint.startswith("^"):
                  version = constraint[1:]
                  upper = [int(part) for part in version.split(".")]
                  pivot = next((i for i, part in enumerate(upper) if part), len(upper) - 1)
                  upper[pivot] += 1
                  upper[pivot + 1:] = [0] * (len(upper) - pivot - 1)
                  constraint = f">={version},<{'.'.join(map(str, upper))}"
              else:
                  constraint = ",".join(constraint.replace(",", " ").split())
              requirements.append(name + constraint)
          subprocess.check_call([sys.executable, "-m", "pip", "install", "-e", ".", *requirements])
          PY

      - name: Run core tests
        run: |
          shopt -s nullglob
          python -m pytest tests/test_batcher*.py tests/test_core_*.py \
            tests/test_force_stop*.py tests/test_stop_cancelled*.py tests/test_request_logging*.py

  unit-tests:
    needs: changed-files
    if: ${{ needs.changed-files.outputs.should_run_unit_tests == 'true' || github.event.action == 'reopened' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-15", "macos-15-intel" ]
        python-version: [ "3.10", "3.11", "3.12" ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ runner.arch }}-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --all-extras

      - name: Install library
        run: poetry install --no-interaction --all-extras

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/

  integration-tests:  # TODO: Improve this job to run just the changed integration tests
    needs: changed-files
    if: ${{ needs.changed-files.outputs.should_run_integration_tests == 'true' || github.event.action == 'reopened' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --all-extras

      - name: Install library
        run: poetry install --no-interaction --all-extras

      - name: Run docker-compose
        run: |
          docker compose \
            -f docker-compose/dynamodb.yml \
            -f docker-compose/postgres.yml \
            up -d --wait

      # TODO: Make the ScyllaDB containers more stable then activate all the integration tests
      - name: Run DynamoDB integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -m integration_dynamodb

      - name: Run Postgres integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -m integration_postgres

  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
