name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Newer commits replace obsolete checks on the same PR or main branch.
# Scheduled/manual runs remain independent, as do different PRs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.plan.outputs.core }}
      adapters: ${{ steps.plan.outputs.adapters }}
      services: ${{ steps.plan.outputs.services }}
      has_adapters: ${{ steps.plan.outputs.has_adapters }}
      has_services: ${{ steps.plan.outputs.has_services }}
      has_examples: ${{ steps.plan.outputs.has_examples }}
      has_provider_recipes: ${{ steps.plan.outputs.has_provider_recipes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        with:
          base: ${{ github.ref }}
          filters: .github/filters.yml
      - name: Select supported interpreters and relevant adapters
        id: plan
        env:
          CHANGED_FILTERS: ${{ steps.changes.outputs.changes }}
        run: python .github/scripts/ci_plan.py

  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.core) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python }}
      - name: Run the core gate without optional dependencies
        run: uv run --no-sync python -m coverage run --parallel-mode --source=async_batcher,examples/recipes -m pytest tests/core -ra

      - name: Upload coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-core-${{ matrix.os }}-py${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  examples:
    name: HTTP recipes (Python ${{ matrix.python }})
    needs: plan
    if: ${{ needs.plan.outputs.has_examples == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python }}
          groups: test example-test
      - name: Check the installed example dependencies
        run: uv run --no-sync python -c 'import fastapi, httpx2, uvicorn; from fastapi.testclient import TestClient'
      - name: Run real HTTP and lifespan checks
        run: uv run --no-sync python -m coverage run --parallel-mode --source=async_batcher,examples/recipes -m pytest tests/examples -ra
      - name: Upload recipe coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-examples-py${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  provider-recipes:
    name: Provider recipes (Python ${{ matrix.python }})
    needs: plan
    if: ${{ needs.plan.outputs.has_provider_recipes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python }}
          groups: test example-test
          extras: pinecone
      - name: Require the real provider clients
        run: uv run --no-sync python -c 'import httpx2; from pinecone import AsyncIndex, Vector'
      - name: Validate provider boundaries against local HTTP servers
        run: uv run --no-sync python -m coverage run --parallel-mode --source=async_batcher,examples/recipes -m pytest tests/provider_recipes -ra
      - name: Upload recipe coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-provider-recipes-py${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  adapters:
    name: Adapter (${{ matrix.suite }}, Python ${{ matrix.python }})
    needs: plan
    if: ${{ needs.plan.outputs.has_adapters == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.adapters) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install HDF5 headers for the Python 3.15 source build
        if: ${{ matrix.suite == 'keras' && matrix.python == '3.15' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libhdf5-dev pkg-config
      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python }}
          groups: ${{ matrix.groups }}
          extras: ${{ matrix.suite }}
      - name: Run the selected adapter tests
        env:
          TEST_SUITE: ${{ matrix.suite }}
          KERAS_BACKEND: jax
          KERAS_HOME: ${{ runner.temp }}/keras
        run: |
          uv run --no-sync python .github/scripts/check_adapter.py "$TEST_SUITE"
          uv run --no-sync python -m coverage run --parallel-mode -m pytest "tests/adapters/$TEST_SUITE" -ra

      - name: Check installed Kafka and Kinesis type contracts
        if: ${{ matrix.suite == 'aws' || matrix.suite == 'kafka' }}
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: uv run --no-sync python .github/scripts/check_public_typing.py --adapter "$TEST_SUITE"

      - name: Upload coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-adapter-${{ matrix.suite }}-py${{ matrix.python }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Verify installed adapter imports outside the checkout
        env:
          TEST_SUITE: ${{ matrix.suite }}
          KERAS_BACKEND: jax
          KERAS_HOME: ${{ runner.temp }}/keras
        run: uv run --no-sync python .github/scripts/check_distributions.py --adapter "$TEST_SUITE"

  services:
    name: Service (${{ matrix.suite }})
    needs: plan
    if: ${{ needs.plan.outputs.has_services == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.services) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: ci-${{ matrix.suite }}
      COMPOSE_FILE: docker-compose/${{ matrix.compose }}.yml
      TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.12'
          groups: ${{ matrix.groups }}
          extras: ${{ matrix.extra }}
      - name: Start the selected service
        timeout-minutes: 6
        run: |
          docker compose up -d --wait --wait-timeout 180
          uv run --no-sync python .github/scripts/wait_for_service.py "$TEST_SUITE"
      - name: Run integration tests
        timeout-minutes: 5
        run: uv run --no-sync python -m coverage run --parallel-mode -m pytest "tests/integration/$TEST_SUITE" -ra
      - name: Upload coverage data
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data-service-${{ matrix.suite }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Capture service diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p service-diagnostics
          docker compose ps --all > service-diagnostics/status.txt 2>&1 || true
          docker compose logs --no-color --tail 300 > service-diagnostics/logs.txt 2>&1 || true
          cat service-diagnostics/status.txt
          cat service-diagnostics/logs.txt
      - name: Tear down containers and volumes
        if: ${{ always() }}
        timeout-minutes: 2
        run: docker compose down --volumes --remove-orphans --timeout 30
      - name: Upload failed service diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-${{ matrix.suite }}-logs
          path: service-diagnostics/
          retention-days: 7

  quality:
    name: Lint, workflow validation and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.12'
          groups: lint typecheck
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}
      - name: Check source formatting and lint
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
      - name: Validate workflow expressions and shell commands
        run: |
          bash .github/scripts/check-workflows.sh
          uv run --no-sync python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check benchmark measurements and cleanup
        run: uv run --no-sync python -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Check installed public type contracts
        run: uv run --no-sync python .github/scripts/check_public_typing.py
      - name: Validate the lock and installed wheel and source distributions
        run: |
          uv lock --check
          uv run --no-sync python .github/scripts/check_distributions.py

  docs:
    name: Documentation build and links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.12'
          groups: docs
      - name: Check documentation tooling
        run: |
          uv run --no-sync python -m unittest discover -s docs/tests -p 'test_*.py'
          uv run --no-sync python -m unittest discover -s .github/scripts -p '*docs*.py'
      - name: Build and validate every documentation page
        env:
          DOCS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --no-sync mkdocs build --strict
          uv run --no-sync python .github/scripts/check_docs.py site
      - name: Preserve the documentation preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: site/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: Combined coverage
    needs: [plan, core, examples, provider-recipes, adapters, services]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: '3.12'
          groups: test
      - name: Test artifact completeness and coverage report generation
        run: uv run --no-sync python -m unittest discover -s .github/scripts -p 'test_report_coverage.py'
      - name: Download each test job's coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: false
      - name: Validate planned artifacts and report selected source coverage
        env:
          CORE_MATRIX: ${{ needs.plan.outputs.core }}
          ADAPTER_MATRIX: ${{ needs.plan.outputs.adapters }}
          SERVICE_MATRIX: ${{ needs.plan.outputs.services }}
          HAS_EXAMPLES: ${{ needs.plan.outputs.has_examples }}
          HAS_PROVIDER_RECIPES: ${{ needs.plan.outputs.has_provider_recipes }}
        run: uv run --no-sync python .github/scripts/report_coverage.py --fail-under 95
      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  ci:
    name: CI passed
    needs: [plan, core, examples, provider-recipes, adapters, services, quality, docs, coverage]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every selected check to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CORE_RESULT: ${{ needs.core.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          ADAPTER_RESULT: ${{ needs.adapters.result }}
          SERVICE_RESULT: ${{ needs.services.result }}
          EXAMPLE_RESULT: ${{ needs.examples.result }}
          PROVIDER_RECIPE_RESULT: ${{ needs.provider-recipes.result }}
          HAS_ADAPTERS: ${{ needs.plan.outputs.has_adapters }}
          HAS_SERVICES: ${{ needs.plan.outputs.has_services }}
          HAS_EXAMPLES: ${{ needs.plan.outputs.has_examples }}
          HAS_PROVIDER_RECIPES: ${{ needs.plan.outputs.has_provider_recipes }}
        run: |
          [[ "$PLAN_RESULT" == success && "$CORE_RESULT" == success && "$QUALITY_RESULT" == success && "$DOCS_RESULT" == success && "$COVERAGE_RESULT" == success ]]
          if [[ "$HAS_ADAPTERS" == true ]]; then [[ "$ADAPTER_RESULT" == success ]]; fi
          if [[ "$HAS_SERVICES" == true ]]; then [[ "$SERVICE_RESULT" == success ]]; fi
          if [[ "$HAS_EXAMPLES" == true ]]; then [[ "$EXAMPLE_RESULT" == success ]]; fi
          if [[ "$HAS_PROVIDER_RECIPES" == true ]]; then [[ "$PROVIDER_RECIPE_RESULT" == success ]]; fi
