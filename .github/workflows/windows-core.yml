name: Windows core probe

on:
  # Validate this exploration on its own PR before it is available for dispatch.
  pull_request:
    paths:
      - .github/workflows/windows-core.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Windows core (Python ${{ matrix.python }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python }}
          groups: test
      - name: Run the unchanged core suite without optional dependencies
        shell: bash
        run: uv run --no-sync python -m pytest tests/core -ra
