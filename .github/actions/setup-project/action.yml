name: Set up the locked project environment
description: Install uv and only the requested locked dependency groups and extras.
inputs:
  python-version:
    description: Python interpreter for the project tests
    required: true
  groups:
    description: Space-separated dependency groups; empty installs only the project
    default: test
  extras:
    description: Space-separated project extras
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version: ${{ inputs.python-version }}
    - name: Identify the dependency selection
      id: dependencies
      shell: bash
      env:
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        PROJECT_EXTRAS: ${{ inputs.extras }}
      run: |
        scope="${DEPENDENCY_GROUPS// /+}-${PROJECT_EXTRAS// /+}"
        printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
    - name: Install uv and restore its package cache
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: '0.13.7'
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
          .github/actions/setup-project/action.yml
        cache-suffix: ${{ steps.python.outputs.python-version }}-${{ steps.dependencies.outputs.scope }}
    - name: Synchronize the selected locked dependencies
      shell: bash
      env:
        SELECTED_PYTHON: ${{ steps.python.outputs.python-path }}
        DEPENDENCY_GROUPS: ${{ inputs.groups }}
        PROJECT_EXTRAS: ${{ inputs.extras }}
      run: |
        install_args=(--locked --no-default-groups --python "$SELECTED_PYTHON")
        read -r -a selected_groups <<< "$DEPENDENCY_GROUPS"
        read -r -a selected_extras <<< "$PROJECT_EXTRAS"
        for group in "${selected_groups[@]}"; do install_args+=(--group "$group"); done
        for extra in "${selected_extras[@]}"; do install_args+=(--extra "$extra"); done
        uv sync "${install_args[@]}"
        # Keep subsequent `uv run --no-sync` commands on the matrix interpreter.
        printf 'UV_PYTHON=%s\n' "$SELECTED_PYTHON" >> "$GITHUB_ENV"
