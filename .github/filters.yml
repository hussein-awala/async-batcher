# Infrastructure changes exercise every supported Python and optional adapter.
infrastructure: &infrastructure
  - '.github/**'
  - 'pyproject.toml'
  - 'uv.lock'
  - 'pytest.ini'
# macOS and Windows core checks are needed when the core implementation or its test inputs change.
core:
  - *infrastructure
  - 'async_batcher/*.py'
  - 'tests/core/**'
  - 'tests/conftest.py'
  - 'tests/core_helpers.py'
  - 'tests/__init__.py'
  # These scripts are executed by the core example lifecycle tests.
  - 'examples/dynamodb/main.py'
  - 'examples/keras/main.py'
  - 'examples/keras_with_grpc/server.py'
  - 'examples/recipes/**'
examples:
  - *infrastructure
  - 'async_batcher/*.py'
  - 'examples/recipes/**'
  - 'tests/examples/**'
  - 'tests/conftest.py'
  - 'tests/core_helpers.py'
  - 'tests/__init__.py'
provider_recipes:
  - *infrastructure
  - 'async_batcher/*.py'
  - 'async_batcher/pinecone/**'
  - 'examples/recipes/cohere_pinecone.py'
  - 'examples/recipes/support.py'
  - 'tests/provider_recipes/**'
  - 'tests/conftest.py'
  - 'tests/core_helpers.py'
  - 'tests/__init__.py'
shared: &shared
  - *infrastructure
  - 'async_batcher/*.py'
  - 'tests/conftest.py'
  - 'tests/core_helpers.py'
  - 'tests/__init__.py'
  - 'tests/adapters/conftest.py'
  - 'tests/integration/conftest.py'
aws:
  - *shared
  - 'async_batcher/aws/**'
  - 'tests/adapters/aws/**'
  - 'tests/typing/aws_*.py'
  - 'tests/integration/aws/**'
  - 'examples/dynamodb/**'
  - 'docker-compose/dynamodb.yml'
sqlalchemy:
  - *shared
  - 'async_batcher/sqlalchemy/**'
  - 'tests/adapters/sqlalchemy/**'
  - 'tests/integration/sqlalchemy/**'
  - 'examples/*sqlalchemy*/**'
  - 'docker-compose/postgres.yml'
scylla:
  - *shared
  - 'async_batcher/scylladb/**'
  - 'tests/adapters/scylla/**'
  - 'tests/integration/scylladb/**'
  - 'docker-compose/scylladb.yml'
mongodb:
  - *shared
  - 'async_batcher/mongodb/**'
  - 'tests/adapters/mongodb/**'
  - 'tests/integration/mongodb/**'
  - 'docker-compose/mongodb.yml'
keras:
  - *shared
  - 'async_batcher/ml/*.py'
  - 'async_batcher/ml/keras/**'
  - 'tests/adapters/keras/**'
  - 'examples/keras/**'
  - 'examples/keras_with_grpc/**'
  - 'examples/diabetes_tf_model.h5'
  - 'examples/train.py'
sklearn:
  - *shared
  - 'async_batcher/ml/*.py'
  - 'async_batcher/ml/sklearn/**'
  - 'tests/adapters/sklearn/**'
  - 'examples/*sklearn*/**'
pinecone:
  - *shared
  - 'async_batcher/pinecone/**'
  - 'tests/adapters/pinecone/**'
kafka:
  - *shared
  - 'async_batcher/kafka/**'
  - 'tests/adapters/kafka/**'
  - 'tests/typing/kafka_*.py'
  - 'tests/integration/kafka/**'
  - 'docker-compose/kafka.yml'
