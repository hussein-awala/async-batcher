[pytest]
testpaths = tests/core tests/adapters
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
markers =
    integration: mark a test as an integration test
    integration_dynamodb: mark a test as a DynamoDB integration test
    integration_scylladb: mark a test as a ScyllaDB integration test
    integration_postgres: mark a test as a Postgres integration test
