[project]
name = "async-batcher"
version = "0.0.1"
description = "Async Python batching for bulk functions, database writes, messaging, and model inference."
authors = [{name = "Hussein Awala", email = "hussein@awala.fr"}]
readme = "README.md"
requires-python = ">=3.11,<4.0"
keywords = ["asyncio", "batching", "bulk-processing", "inference", "backpressure"]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Repository = "https://github.com/hussein-awala/async-batcher"
"Bug Tracker" = "https://github.com/hussein-awala/async-batcher/issues"
Documentation = "https://github.com/hussein-awala/async-batcher/blob/main/README.md"

[project.optional-dependencies]
aws = [
    "aioboto3>=15.5,<16",
    "aiohttp>=3.14.4,<4",
    "urllib3>=2.8.0,<3",
    "idna>=3.15,<4",
]
kafka = ["aiokafka>=0.15.0,<1"]
scylla = ["scylla-driver>=3.29.13,<4"]
keras = ["keras>=3.15.1,<4", "pygments>=2.20,<3"]
sklearn = ["scikit-learn>=1.9.1,<2"]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0.10,<3"]
pinecone = ["pinecone>=10.3,<11"]
mongodb = ["pymongo>=4.19,<5"]

[dependency-groups]
test = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.1.post1,<2",
    "pygments>=2.20,<3",
    "coverage>=7.17.2,<8",
]
adapter-test = ["aiosqlite>=0.22.1,<0.23", "asyncpg>=0.32,<0.33"]
example-test = [
    "fastapi>=0.162.2,<1",
    "httpx2>=2.16,<3",
    "uvicorn>=0.54,<1",
]
ml-test = [
    "jax>=0.10.2,<0.11; python_version < '3.12'",
    "jax>=0.12.0.1,<0.13; python_version >= '3.12'",
]
lint = [
    "pre-commit>=4.7,<5",
    "virtualenv>=21.14.9,<22",
    "filelock>=4.2.1,<5",
    "ruff==0.17.4",
]
typing = ["types-aioboto3[dynamodb]>=15.5,<16"]
typecheck = ["mypy==2.4.1"]

[tool.uv]
required-version = ">=0.13.7"
default-groups = ["test"]

[tool.uv.build-backend]
module-name = "async_batcher"
module-root = ""

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 110
indent-width = 4
src = ["async_batcher", "examples", "tests"]
extend-exclude = ["*_pb2*"]
force-exclude = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = ["E712"]
select = [
    "E", # pycodestyle
    "W", # pycodestyle
    "F", # Pyflakes
    "B", # flake8-bugbear
    "PIE", # flake8-pie
    "C4", # flake8-comprehensions
    "I", # isort
    "UP", # pyupgrade,
    "TC", # flake8-type-checking
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.isort]
known-third-party = ["sqlalchemy", "pinecone"]
required-imports = ["from __future__ import annotations"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
branch = true
source = ["async_batcher"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
