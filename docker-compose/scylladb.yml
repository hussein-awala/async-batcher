services:
  scylla:
    image: scylladb/scylla:2026.3.4@sha256:d864230da81af7f6cdcf68446a440e0e4a55a0827fcf49af00725f660e8647d3
    ports:
      - "127.0.0.1:9042:9042"
    mem_limit: 3g
    command:
      - --smp
      - "1"
      - --memory
      - 2G
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "SELECT key FROM system.local;"]
      start_period: 60s
      interval: 5s
      timeout: 10s
      retries: 24
